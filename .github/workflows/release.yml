# Release dry-run. Live npm publish is NOT done here.
#
# Chosen path (2026-08): short-lived local GAT + `pnpm release:publish`.
# Trusted Publishing (OIDC) is deferred — npm account WebAuthn cannot be
# completed on the current operator machine, and `npm trust` requires it.
# 2FA-bypass GATs can still publish until January 2027; revoke after each use.
#
# Do not store NPM_TOKEN as a standing GitHub secret. When WebAuthn is
# available, configure Trusted Publisher on each package (release.yml / env npm)
# and switch this workflow's publish job to OIDC.

name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run only (live publish is local: pnpm release:publish)"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Pack check + publish dry-run
        run: pnpm release:dry
