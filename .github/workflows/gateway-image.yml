name: Gateway image

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agenttab-gateway
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER}"
          pkg="agenttab-gateway"
          for path in \
            "users/${owner}/packages/container/${pkg}" \
            "user/packages/container/${pkg}"; do
            echo "Trying GET ${path}"
            if gh api "$path" --jq '{name,visibility,html_url}' ; then
              vis="$(gh api "$path" --jq '.visibility')"
              if [ "$vis" = "public" ]; then
                echo "Already public via ${path}"
                exit 0
              fi
              echo "PATCH ${path} visibility=public"
              if gh api --method PATCH "$path" -f visibility=public; then
                echo "Visibility updated via ${path}"
                exit 0
              fi
            fi
          done
          echo "Could not change visibility via REST; listing packages for diagnostics"
          gh api "users/${owner}/packages?package_type=container" --jq '.' || true
          exit 1
